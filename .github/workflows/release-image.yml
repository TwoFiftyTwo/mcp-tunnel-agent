# Build, sign, and publish the tunnel agent container image.
#
# This runs HERE, in the public repository, on the source snapshot the
# private monorepo exports on every release. Building in the open means:
#   - the cosign signature's identity is THIS workflow at a v* tag — a
#     workflow anyone can read, building source anyone can audit;
#   - GitHub build-provenance attestations work (they are unavailable to
#     private repositories on our plan);
#   - the published image is a build of exactly the published source.
#
# Trigger: the monorepo's release push of tag vX.Y.Z. A re-release of an
# existing tag does not move the tag, so no push event fires — re-run with:
#   gh workflow run release-image.yml --ref vX.Y.Z
#
# Every action below is pinned by commit SHA: this job holds packages:write
# and id-token:write and produces the artifact customers verify.
name: Release container image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/twofiftytwo/mcp-tunnel-agent

jobs:
  publish-image:
    name: Publish image (GHCR, cosign-signed + provenance)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # ambient OIDC identity for keyless cosign + provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version and check it matches the code
        id: tags
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/tags/v*) ;;
            *)
              echo "::error::run this workflow on a v* tag ref (gh workflow run release-image.yml --ref vX.Y.Z) — a branch run would sign with a branch identity customers cannot verify"
              exit 1
              ;;
          esac
          VERSION="${GITHUB_REF_NAME#v}"
          CODE_VERSION=$(grep -oE 'const AGENT_VERSION = "[^"]+"' src/main.ts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$VERSION" != "$CODE_VERSION" ]; then
            echo "::error::tag version $VERSION != AGENT_VERSION $CODE_VERSION in src/main.ts"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit's own provenance/sbom manifests are off: they add
      # unknown/unknown entries to the manifest list, and the provenance
      # customers verify is the explicit attestation below. Only the exact
      # version tag is pushed here — the customer-facing major tag is
      # promoted in the last step, after signing and verification succeed.
      - name: Build and push (amd64 + arm64)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ steps.tags.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=TwoFiftyTwo MCP tunnel agent — outbound-only tunnel connecting a private MCP server to TwoFiftyTwo
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature's certificate identity is this workflow at
      # this tag, witnessed in the public Rekor transparency log. Sign the
      # manifest LIST digest — verifying a tag resolves to that digest.
      - name: Sign the image (cosign keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # SLSA build provenance, also pushed to the registry so it is
      # verifiable straight from the public package.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Independent verification: the signing steps succeeding is not the
      # same as a customer's verify succeeding. These are the exact commands
      # the README documents.
      - name: Verify signature and provenance
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-image\.yml@refs/tags/v.*$" \
            -o text
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --owner TwoFiftyTwo --bundle-from-oci

      # The customer-facing major tag moves only now — after signing and the
      # verify step — and never backwards: a re-release of an old tag must
      # not repoint :1 at an older agent. "Newest" is decided by semver
      # against the version tags already published on GHCR.
      - name: Promote the major tag
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.tags.outputs.version }}
          MAJOR: ${{ steps.tags.outputs.major }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published=$(gh api --paginate "/orgs/TwoFiftyTwo/packages/container/mcp-tunnel-agent/versions" \
            --jq '.[].metadata.container.tags[]' | grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" || true)
          newest=$(printf '%s\n%s\n' "$published" "$VERSION" | grep -v '^$' | sort -V | tail -1)
          if [ "$newest" != "$VERSION" ]; then
            echo "::notice::not promoting :${MAJOR} — ${newest} is already published and newer than ${VERSION}"
            exit 0
          fi
          docker buildx imagetools create -t "${IMAGE}:${MAJOR}" "${IMAGE}@${DIGEST}"

      # Signatures and attestations attach to the DIGEST, and imagetools
      # create points the major tag at that same digest — but customers run
      # the tag-level commands, so prove those exact commands on every
      # release rather than reasoning it out. (If promotion was skipped, the
      # tag points at a newer, equally signed release and still verifies.)
      - name: Verify the promoted tag
        env:
          MAJOR: ${{ steps.tags.outputs.major }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}:${MAJOR}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-image\.yml@refs/tags/v.*$" \
            -o text
          gh attestation verify "oci://${IMAGE}:${MAJOR}" --owner TwoFiftyTwo --bundle-from-oci
